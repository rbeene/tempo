name: Tempo verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tempo-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Format, vet, tests, race, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HARVEST_TOKEN: ''
      HARVEST_ACCOUNT_ID: ''
      TEMPO_CONFIG: /tmp/tempo-ci-config-unused.json
      GOMAXPROCS: "2"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go version
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - run: sh scripts/test-install.sh
      - run: sh scripts/test-release-version.sh
      - run: python3 -B scripts/test-release-assets.py
      - name: Native fixture safety and protocol tests (no host execution)
        run: python3 -B scripts/native-hooks/test_codex_smoke.py
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.2
          install-only: true
      - name: Validate release configurations and Linux snapshot
        run: |
          goreleaser check
          goreleaser check --config .goreleaser.macos.yaml
          goreleaser release --snapshot --clean --skip=publish --parallelism=1
      - name: Build Linux single binary
        run: go build -trimpath -ldflags="-s -w -X github.com/rbeene/tempo/internal/cli.Version=${GITHUB_SHA}" -o bin/tempo ./cmd/tempo
      - name: Offline smoke checks and schema drift
        run: |
          bin/tempo version
          bin/tempo help
          bin/tempo schema > /tmp/tempo-schema.json
          cmp docs/cli-schema.json /tmp/tempo-schema.json
      - name: Build native fixture setup and read helper
        run: go test -c -o bin/tempo-native-fixture.test ./internal/nativefixture
      - name: Native Codex hook acceptance (synthetic loopback provider)
        timeout-minutes: 5
        run: python3 -B scripts/native-hooks/codex_smoke.py --tempo bin/tempo --helper bin/tempo-native-fixture.test --evidence bin/native-codex-evidence.json
      - name: Upload allowlisted native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tempo-native-codex-${{ github.sha }}
          path: bin/native-codex-evidence.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tempo-linux-${{ runner.arch }}
          path: |
            bin/tempo
            coverage.out
          retention-days: 7

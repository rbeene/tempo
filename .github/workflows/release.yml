name: Prepare versioned release
# Never runs on pull_request or pull_request_target. The owner deliberately
# dispatches from integration after a separately approved tag exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing approved tag, e.g. v0.1.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tempo-release
  cancel-in-progress: false
jobs:
  macos:
    if: github.repository == 'rbeene/tempo' && github.ref == 'refs/heads/integration' && github.actor == github.repository_owner
    runs-on: macos-14
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved tag and check out exact commit
        run: |
          case "$RELEASE_TAG" in *[!v0-9.]*) exit 1 ;; esac
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/integration
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.2
          install-only: true
      - run: go test -race ./...
      - name: Build native Mac archives without publishing
        run: goreleaser release --config .goreleaser.macos.yaml --clean --skip=publish --parallelism=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-macos
          path: |
            dist/macos/tempo_*_darwin_*.tar.gz
            dist/macos/checksums-darwin.txt
          retention-days: 1
  package:
    needs: macos
    if: github.repository == 'rbeene/tempo' && github.ref == 'refs/heads/integration' && github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, tempo]
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved tag and check out exact commit
        run: |
          case "$RELEASE_TAG" in *[!v0-9.]*) exit 1 ;; esac
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/integration
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - name: Select pinned tools through mise
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/mise.toml
        run: |
          mise install
          printf '%s/bin\n' "$(mise where go@1.27.1)" >> "$GITHUB_PATH"
          mise where goreleaser@2.18.2 >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-macos
          path: release-macos
      - name: Validate native archive checksums
        run: cd release-macos && sha256sum --check checksums-darwin.txt
      - run: go test -race ./...
      - name: Package Linux and attach Mac archives to a draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --parallelism=1

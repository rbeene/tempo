name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tempo-release
  cancel-in-progress: false
  queue: max
jobs:
  macos:
    if: github.repository == 'rbeene/tempo'
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version and create local build tag
        id: version
        run: |
          tag=$(sh scripts/release-version.sh)
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'GORELEASER_CURRENT_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git tag "$tag" "$GITHUB_SHA"
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.2
          install-only: true
      - name: Validate and test native Mac build
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race -count=1 -timeout=45m ./...
          goreleaser check --config .goreleaser.macos.yaml
      - name: Build native Mac archives without publishing
        run: goreleaser release --config .goreleaser.macos.yaml --clean --skip=publish --parallelism=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-macos
          path: |
            dist/macos/tempo_*_darwin_*.tar.gz
            dist/macos/checksums-darwin.txt
          retention-days: 7
  publish:
    needs: macos
    if: github.repository == 'rbeene/tempo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      RELEASE_TAG: ${{ needs.macos.outputs.tag }}
      GORELEASER_CURRENT_TAG: ${{ needs.macos.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.2
          install-only: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-macos
          path: release-macos
      - name: Validate and test Linux build
        run: |
          case "$RELEASE_TAG" in *[!v0-9.]*) exit 1 ;; esac
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
          fi
          (cd release-macos && sha256sum --check checksums-darwin.txt)
          go vet ./...
          go test -race -count=1 -timeout=45m ./...
          sh scripts/test-install.sh
          sh scripts/test-release-version.sh
          python3 -B scripts/test-release-assets.py
          goreleaser check
          goreleaser release --clean --skip=publish --parallelism=1
      - name: Create version tag and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A retry reuses the same commit's tag and leaves a published release intact.
          if remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            test "$remote_commit" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = false ]; then
              printf '%s\n' "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
          fi
          # GoReleaser stages all four archives and checksums in a draft first.
          goreleaser release --clean --parallelism=1
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/tempo-release-assets.json"
          python3 scripts/check-release-assets.py "$RELEASE_TAG" < "$RUNNER_TEMP/tempo-release-assets.json"
          release_id=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=legacy > /dev/null
